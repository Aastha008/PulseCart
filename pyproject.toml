[tool.kedro]
package_name = "pulsecart"
project_name = "PulseCart"
kedro_init_version = "1.6.0"

[project]
name = "pulsecart"
version = "1.0.0"
description = "PulseCart - E-Commerce Funnel Optimization & Retention Infrastructure"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kedro>=1.6.0",
    "kedro-datasets>=9.0.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "duckdb>=0.9.0",
    "pyarrow>=12.0.0",
]

[project.scripts]
pulsecart = "pulsecart.__main__:main"
