name: Analytics Pipeline CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "dbt_pulsecart/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/analytics-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "dbt_pulsecart/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/analytics-ci.yml"

jobs:
  test-analytics:
    name: Test Analytics & Experimentation Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Analytics Test Suite
        run: pytest tests/unit
