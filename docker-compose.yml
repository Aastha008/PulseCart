services:
  pulsecart-db:
    image: postgres:16-alpine
    container_name: pulsecart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsecart_db
      POSTGRES_USER: pulsecart_user
      POSTGRES_PASSWORD: pulsecart_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsecart_user -d pulsecart_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pulsecart-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsecart-backend
    restart: unless-stopped
    depends_on:
      pulsecart-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pulsecart-db:5432/pulsecart_db
      SPRING_DATASOURCE_USERNAME: pulsecart_user
      SPRING_DATASOURCE_PASSWORD: pulsecart_password
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
