server:
  port: 0

spring:
  application:
    name: pulsecart-backend-test
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pulsecart_db}
    username: ${SPRING_DATASOURCE_USERNAME:pulsecart_user}
    password: ${SPRING_DATASOURCE_PASSWORD:pulsecart_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 3600000 # 1 hour
