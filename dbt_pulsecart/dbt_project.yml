name: 'pulsecart'
version: '1.0.0'
config-version: 2

profile: 'pulsecart'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  pulsecart:
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["intermediate"]
    marts:
      +schema: marts
      +tags: ["marts"]
      core:
        +materialized: table
      facts:
        fct_funnel:
          +materialized: incremental
        fct_orders:
          +materialized: incremental
        fct_user_retention:
          +materialized: table
        fct_ab_test:
          +materialized: table
      dimensions:
        +materialized: table
